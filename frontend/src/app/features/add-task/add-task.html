<div class="add-task-page">

  <a routerLink="/dashboard" class="back-link">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
    Back to Dashboard
  </a>

  <div class="add-task-card">
    <h2 class="add-task-card__title">Create New Task</h2>
    <p class="add-task-card__subtitle">Set up a task to track progress and compete with friends.</p>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">

      @if (errorMsg) {
        <div class="error-banner">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          {{ errorMsg }}
        </div>
      }

      <div class="form-field">
        <label>Task Name *</label>
        <input type="text" formControlName="name" placeholder="e.g. Basketball Wins">
      </div>

      <div class="form-field">
        <label>Description</label>
        <textarea formControlName="description" rows="3" placeholder="What are you tracking? (optional)"></textarea>
      </div>

      <div class="form-field">
        <label>Unit of Measure *</label>
        <input type="text" formControlName="unitLabel" placeholder="e.g. wins, km, reps">
        <p class="form-field__hint">This label appears on leaderboards and achievement descriptions.</p>
      </div>

      <button type="submit" class="submit-btn" [disabled]="taskForm.invalid || isSubmitting">
        @if (isSubmitting) {
          <svg class="submit-btn__spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Creating...
        } @else {
          Create Task
        }
      </button>

    </form>
  </div>
</div>
