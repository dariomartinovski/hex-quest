<div class="p-4 sm:p-6 max-w-lg mx-auto">

  <!-- Back Link -->
  <a routerLink="/dashboard" class="inline-flex items-center gap-1 text-gray-500 hover:text-indigo-600 text-sm mb-6 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
    Back to Dashboard
  </a>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
    <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight mb-2">Create New Task</h2>
    <p class="text-sm text-gray-500 mb-8">Set up a task to track progress and compete with friends.</p>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="space-y-5">

      @if (errorMsg) {
        <div class="bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center gap-2 border border-red-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          {{ errorMsg }}
        </div>
      }

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Task Name *</label>
        <input type="text" formControlName="name"
          class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all"
          placeholder="e.g. Basketball Wins">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Description</label>
        <textarea formControlName="description" rows="3"
          class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all resize-none"
          placeholder="What are you tracking? (optional)"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Unit of Measure *</label>
        <input type="text" formControlName="unitLabel"
          class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all"
          placeholder="e.g. wins, km, reps">
        <p class="mt-1.5 text-xs text-gray-400">This label appears on leaderboards and achievement descriptions.</p>
      </div>

      <button type="submit" [disabled]="taskForm.invalid || isSubmitting"
        class="w-full flex justify-center py-3.5 px-4 mt-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-[0.98]">
        @if (isSubmitting) {
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Creating...
        } @else {
          Create Task
        }
      </button>
    </form>
  </div>
</div>
