<div class="register-page">
  <div class="register-page__blob register-page__blob--left"></div>
  <div class="register-page__blob register-page__blob--right"></div>

  <div class="register-card">
    <div class="register-card__body">

      <div class="register-header">
        <h2>Create Account</h2>
        <p>Join and track your milestones alongside friends.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">

        @if (errorMsg) {
          <div class="error-banner">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
            {{ errorMsg }}
          </div>
        }

        <div class="form-row">
          <div class="form-field">
            <label>Username *</label>
            <input type="text" formControlName="username" placeholder="johndoe">
          </div>
          <div class="form-field">
            <label>Display Name</label>
            <input type="text" formControlName="displayName" placeholder="John D.">
          </div>
        </div>

        <div class="form-field">
          <label>Email Address *</label>
          <input type="email" formControlName="email" placeholder="john@example.com">
        </div>

        <div class="form-field">
          <label>Password *</label>
          <input type="password" formControlName="password" placeholder="••••••••">
          <p class="form-field__hint">Must be at least 6 characters.</p>
        </div>

        <div class="form-field">
          <label>Sex (Optional)</label>
          <select formControlName="sex">
            <option value="">Select...</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <button type="submit" class="submit-btn" [disabled]="registerForm.invalid || isSubmitting">
          @if (isSubmitting) {
            <svg class="submit-btn__spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Creating Account...
          } @else {
            Register
          }
        </button>

      </form>
    </div>

    <div class="register-card__footer">
      <p>Already have an account? <a routerLink="/login">Log in</a></p>
    </div>
  </div>
</div>
