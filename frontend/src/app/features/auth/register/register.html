<div class="min-h-screen bg-gray-50 flex items-center justify-center relative overflow-hidden p-6 py-12">
  <!-- Decorative background elements -->
  <div class="absolute top-1/2 left-0 -translate-y-1/2 -ml-32 w-[30rem] h-[30rem] bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
  <div class="absolute top-1/2 right-0 -translate-y-1/2 -mr-32 w-[30rem] h-[30rem] bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>

  <div class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden border border-white/40 z-10 transition-all">
    
    <div class="p-8 sm:p-10">
      <div class="mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Create Account</h2>
        <p class="mt-2 text-sm text-gray-500">Join and track your milestones alongside friends.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        @if (errorMsg) {
          <div class="bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center gap-2 border border-red-100">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
            {{ errorMsg }}
          </div>
        }

        <!-- Username and Display Name in a Row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Username *</label>
            <input type="text" formControlName="username" class="block w-full px-3 py-2.5 border border-gray-200 rounded-lg leading-5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="johndoe">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Display Name</label>
            <input type="text" formControlName="displayName" class="block w-full px-3 py-2.5 border border-gray-200 rounded-lg leading-5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="John D.">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email Address *</label>
          <input type="email" formControlName="email" class="block w-full px-3 py-2.5 border border-gray-200 rounded-lg leading-5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="john@example.com">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Password *</label>
          <input type="password" formControlName="password" class="block w-full px-3 py-2.5 border border-gray-200 rounded-lg leading-5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="••••••••">
          <p class="mt-1 text-xs text-gray-400">Must be at least 6 characters.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Sex (Optional)</label>
          <select formControlName="sex" class="block w-full px-3 py-2.5 border border-gray-200 rounded-lg leading-5 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
            <option value="">Select...</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isSubmitting" class="w-full flex justify-center py-3 px-4 mt-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-[0.98]">
          @if(isSubmitting) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Creating Account...
          } @else {
            Register
          }
        </button>
      </form>
    </div>
    
    <div class="px-8 py-5 bg-gray-50/80 border-t border-gray-100/60 text-center backdrop-blur-sm">
      <p class="text-sm text-gray-600">
        Already have an account? 
        <a routerLink="/login" class="font-bold text-indigo-600 hover:text-indigo-500 transition-colors">Log in</a>
      </p>
    </div>
  </div>
</div>
