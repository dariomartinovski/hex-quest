<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-backdrop__overlay"></div>

  <div class="modal">

    @if (showSuccess()) {
      <div class="success-state">
        <div class="success-state__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
        </div>
        <h3 class="success-state__title">Progress Logged!</h3>
        <p class="success-state__subtitle">+{{ delta() }} {{ unitLabel }}</p>
      </div>

    } @else {

      <div class="modal-handle">
        <div class="modal-handle__bar"></div>
      </div>

      <div class="modal-header">
        <h3 class="modal-header__title">Log Progress</h3>
        <button class="modal-header__close" (click)="close.emit()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="delta-display">
        <div class="delta-display__value">{{ delta() }}</div>
        <p class="delta-display__unit">{{ unitLabel }}</p>
      </div>

      <div class="quick-add">
        <button class="quick-add__btn quick-add__btn--add" (click)="quickAdd(1)">+1</button>
        <button class="quick-add__btn quick-add__btn--add" (click)="quickAdd(5)">+5</button>
        <button class="quick-add__btn quick-add__btn--add" (click)="quickAdd(10)">+10</button>
        <button class="quick-add__btn quick-add__btn--reset" (click)="setDelta(1)">Reset</button>
      </div>

      <div class="form-field">
        <label>Custom Amount</label>
        <input
          type="number"
          [ngModel]="delta()"
          (ngModelChange)="setDelta($event)"
          min="1"
          style="text-align: center; font-size: 1.125rem; font-weight: 700;"
        >
      </div>

      <div class="form-field" style="margin-bottom: 1.5rem;">
        <label>Note (optional)</label>
        <input
          type="text"
          [ngModel]="note()"
          (ngModelChange)="note.set($event)"
          placeholder="e.g. Won against John"
        >
      </div>

      <button
        class="modal-record-btn"
        (click)="submit()"
        [disabled]="isSubmitting() || delta() <= 0"
      >
        @if (isSubmitting()) {
          <svg class="modal-record-btn__spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        } @else {
          Record +{{ delta() }} {{ unitLabel }}
        }
      </button>

    }

  </div>
</div>
