<div class="app-shell">

  <!-- Top Header -->
  <header class="app-header">
    <div class="app-header__brand">
      <div class="app-header__logo">AT</div>
      <h1 class="app-header__title">Hex Quests</h1>
    </div>

    <div class="app-header__actions">
      @if (currentUser()) {
        <div class="app-header__user" (click)="logout()">
          @if (currentUser()?.avatarUrl) {
            <img [src]="currentUser()?.avatarUrl" class="app-header__avatar app-header__avatar--img">
          } @else {
            <div class="app-header__avatar app-header__avatar--initials">
              {{ currentUser()?.username?.charAt(0) | uppercase }}
            </div>
          }
          <span class="app-header__logout-label">Logout</span>
        </div>
      }
    </div>
  </header>

  <!-- Main Scrollable Content Area -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation Bar (Mobile) -->
  <nav class="bottom-nav">
    <div class="bottom-nav__inner">

      <a routerLink="/dashboard" routerLinkActive="bottom-nav__item--active" class="bottom-nav__item">
        <svg xmlns="http://www.w3.org/2000/svg" class="bottom-nav__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="bottom-nav__label">Home</span>
      </a>

      <button class="bottom-nav__fab-wrapper">
        <div class="bottom-nav__fab">
          <svg xmlns="http://www.w3.org/2000/svg" class="bottom-nav__fab-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
      </button>

      <a routerLink="/profile" routerLinkActive="bottom-nav__item--active" class="bottom-nav__item">
        <svg xmlns="http://www.w3.org/2000/svg" class="bottom-nav__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="bottom-nav__label">Profile</span>
      </a>

    </div>
  </nav>

</div>
