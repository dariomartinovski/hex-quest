<div class="flex flex-col h-screen bg-gray-50 text-gray-900">
  
  <!-- Top Header -->
  <header class="flex items-center justify-between px-4 py-3 bg-white shadow-sm shrink-0 z-10">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded bg-indigo-600 text-white flex items-center justify-center font-bold">
        AT
      </div>
      <h1 class="text-xl font-bold text-gray-800 tracking-tight">Hex Quests</h1>
    </div>

    <!-- User Avatar & Dropdown / Logout -->
    <div class="flex items-center gap-3">
      @if (currentUser()) {
        <div class="flex items-center gap-2 cursor-pointer bg-gray-100 px-3 py-1.5 rounded-full hover:bg-gray-200" (click)="logout()">
          @if (currentUser()?.avatarUrl) {
            <img [src]="currentUser()?.avatarUrl" class="w-7 h-7 rounded-full object-cover">
          } @else {
            <div class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm">
              {{ currentUser()?.username?.charAt(0) | uppercase }}
            </div>
          }
          <span class="text-sm font-medium pr-1 text-gray-700 hidden sm:block">Logout</span>
        </div>
      }
    </div>
  </header>

  <!-- Main Scrollable Content Area -->
  <main class="flex-1 overflow-y-auto pb-20 sm:pb-0">
    <!-- Angular Router Outlet for Child Routes -->
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation Bar (Mobile First) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-2px_10px_-5px_rgba(0,0,0,0.1)] z-20 sm:hidden">
    <div class="flex justify-around items-center h-16">
      <!-- Nav Item 1: Dashboard -->
      <a routerLink="/dashboard" routerLinkActive="text-indigo-600 font-semibold" class="flex flex-col items-center justify-center w-full h-full text-gray-500 hover:text-indigo-600 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-[10px] uppercase tracking-wider">Home</span>
      </a>

      <!-- Nav Item 2: Log Progress (FAB-style) -->
      <button class="flex flex-col items-center justify-center -mt-6">
        <div class="w-14 h-14 bg-indigo-600 rounded-full text-white shadow-lg flex items-center justify-center hover:bg-indigo-700 hover:scale-105 active:scale-95 transition-all outline-8 outline-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
      </button>

      <!-- Nav Item 3: Profile/Hex Quests -->
      <a routerLink="/profile" routerLinkActive="text-indigo-600 font-semibold" class="flex flex-col items-center justify-center w-full h-full text-gray-500 hover:text-indigo-600 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="text-[10px] uppercase tracking-wider">Profile</span>
      </a>
    </div>
  </nav>

</div>
